<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zabi AI Developer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: radial-gradient(circle at top, #0f172a, #020617);
      color:#e5e7eb;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      background:#020617;
      border:1px solid #1e293b;
      border-radius:16px;
      padding:25px;
      width:100%;
      max-width:420px;
      box-shadow:0 0 30px rgba(56,189,248,0.15);
    }

    h1{
      color:#38bdf8;
      text-align:center;
      margin-bottom:8px;
    }

    p{
      text-align:center;
      color:#94a3b8;
      font-size:14px;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:none;
      outline:none;
      font-size:15px;
      background:#020617;
      color:white;
      border:1px solid #334155;
      margin-bottom:12px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      color:#020617;
      font-weight:bold;
      font-size:15px;
      cursor:pointer;
    }

    button:hover{
      background:#0ea5e9;
    }

    footer{
      text-align:center;
      font-size:12px;
      color:#64748b;
      margin-top:16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🤖 Zabi AI Developer</h1>
    <p>Your 2025 AI vibes are here</p>

    <input type="text" placeholder="Ask Zabi AI something..." />
    <button onclick="alert('AI feature coming soon 🚀')">Ask AI</button>

    <footer>
      © 2025 Zabi AI Developer
    </footer>
  </div>

</body>
</html>
