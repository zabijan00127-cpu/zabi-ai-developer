<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zabi AI Developer</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background">
    <div class="card">

      <!-- HEADER -->
      <div class="header">
        💗 <span>Zabi AI Developer</span>
      </div>

      <div class="subtext">
        Your 2025 Zabi AI vibes are here →
      </div>

      <!-- MAIN TITLE -->
      <h1 class="main-title">Got an idea, zabi?</h1>

      <!-- INPUT -->
      <input
        class="input-box"
        placeholder="Ask Zabi AI to create a landing page..."
      />

      <!-- CATEGORIES -->
      <div class="categories">
        <span class="active">Recent Creations</span>
        <span>My AI Projects</span>
        <span>AI Templates</span>
      </div>

      <!-- CONTENT -->
      <div id="content" class="content-text">
        🔥 Your recent AI creations will appear here.
      </div>

    </div>
  </div>

  <!-- JS (IMPORTANT) -->
  <script src="script.js"></script>

</body>
</html>
